server {
    listen 80;
    listen [::]:80;
    server_name trading.abc.net;

    client_max_body_size 2m;

    # Ung dung da co dang nhap rieng. Co the bo comment hai dong duoi
    # neu muon them mot lop Basic Authentication cua Nginx.
    # auth_basic "Trading Signal";
    # auth_basic_user_file /etc/nginx/.htpasswd-trading-signal;

    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
